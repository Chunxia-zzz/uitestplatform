# Alembic configuration (GAP-33).
#
# NOTE: keep this file ASCII-only -- configparser reads it with the system locale
# (GBK on this dev machine), and non-ASCII comments break `alembic` on Windows.
#
# The database URL is NOT stored here: alembic/env.py reads it from the app
# config (UIP_DATABASE_URL), so migrations and the app can never point at
# different databases.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
