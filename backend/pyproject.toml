[project]
name = "uitestplatform-backend"
version = "0.1.0"
description = "多引擎 UI 自动化平台 · 后端（M1 骨架 + M2 元素库）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jsonschema>=4.22",
  "playwright>=1.47",
]

[project.optional-dependencies]
mysql = ["aiomysql>=0.2.0"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6", "import-linter>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]           # FastAPI Depends 惯用法

[tool.ruff.lint.per-file-ignores]
# 测试里直接写/读临时文件是惯用法（tmp_path + 内容断言），不为它包 to_thread
"tests/**" = ["ASYNC230", "ASYNC240"]

[tool.importlinter]
root_packages = ["app"]

# 分层红线（M1 §2.2 + M2 RL-M2-1/M2）
[[tool.importlinter.contracts]]
name = "domain 不得依赖业务层"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.services", "app.api", "app.repositories", "app.engines"]

[[tool.importlinter.contracts]]
name = "元素管理服务不得直接依赖引擎"
type = "forbidden"
source_modules = ["app.services.element_service"]
forbidden_modules = ["app.engines.adapters"]
