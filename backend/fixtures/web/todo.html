<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Todo Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 48px auto; padding: 0 16px; color: #1b1f24; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    form { display: flex; gap: 8px; margin-bottom: 12px; }
    input { flex: 1; padding: 9px 12px; border: 1px solid #d8dbe0; border-radius: 8px; font-size: 14px; }
    button { padding: 9px 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff;
             font-size: 14px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #count-line { color: #6b7280; font-size: 13px; margin: 0 0 8px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; justify-content: space-between;
         padding: 10px 12px; border: 1px solid #e3e6ea; border-radius: 8px; margin-bottom: 8px; }
    li button { background: #dc2626; padding: 5px 10px; font-size: 12px; }
    li button:hover { background: #b91c1c; }
    #empty { color: #9aa1ab; font-size: 13px; }
  </style>
</head>
<body>
  <h1>待办清单</h1>

  <form id="form">
    <input id="new-todo" data-testid="new-todo" placeholder="要做什么？" aria-label="新待办">
    <button id="add" data-testid="add" type="submit">添加</button>
  </form>

  <p id="count-line">共 <span id="count" data-testid="count">0</span> 项</p>
  <ul id="list" data-testid="list"></ul>
  <div id="empty">还没有待办</div>

  <script>
    const items = []
    const list = document.getElementById('list')
    const count = document.getElementById('count')
    const empty = document.getElementById('empty')
    const input = document.getElementById('new-todo')

    function render() {
      list.innerHTML = ''
      items.forEach((text, index) => {
        const li = document.createElement('li')
        li.dataset.testid = 'todo-item'
        const label = document.createElement('span')
        label.textContent = text
        const del = document.createElement('button')
        del.type = 'button'
        del.dataset.testid = 'delete'
        del.textContent = '删除'
        del.addEventListener('click', () => {
          items.splice(index, 1)
          render()
        })
        li.appendChild(label)
        li.appendChild(del)
        list.appendChild(li)
      })
      count.textContent = String(items.length)
      empty.style.display = items.length ? 'none' : 'block'
    }

    document.getElementById('form').addEventListener('submit', (event) => {
      event.preventDefault()
      const text = input.value.trim()
      if (!text) return
      items.push(text)
      input.value = ''
      render()
    })
  </script>
</body>
</html>
