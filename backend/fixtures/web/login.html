<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Demo Login</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center;
           align-items: center; height: 100vh; margin: 0; background: #f5f6f8; }
    form { background: #fff; padding: 32px 36px; border-radius: 12px; width: 300px;
           box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    h1 { font-size: 18px; margin: 0 0 20px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 14px;
            border: 1px solid #d8dbe0; border-radius: 8px; font-size: 14px; }
    button { width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #2563eb;
             color: #fff; font-size: 15px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #welcome { margin-top: 16px; color: #16a34a; font-size: 14px; min-height: 20px; }
    #error { color: #dc2626; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <form id="loginForm">
    <h1>请登录</h1>
    <input data-testid="username" id="username" placeholder="用户名" aria-label="用户名">
    <input data-testid="password" id="password" type="password" placeholder="密码" aria-label="密码">
    <div id="error"></div>
    <button data-testid="submit" id="submit" type="submit" title="提交登录">登录</button>
    <div id="welcome" data-testid="welcome"></div>
  </form>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault()
      const u = document.getElementById('username').value.trim()
      const p = document.getElementById('password').value.trim()
      const err = document.getElementById('error')
      const welcome = document.getElementById('welcome')
      err.textContent = ''
      if (!u || !p) { err.textContent = '用户名和密码不能为空'; welcome.textContent = ''; return }
      if (u === 'jerry' && p === 's3cret') {
        welcome.textContent = '欢迎回来，' + u
      } else {
        err.textContent = '用户名或密码错误'
        welcome.textContent = ''
      }
    })
  </script>
</body>
</html>
